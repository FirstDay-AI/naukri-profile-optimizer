name: Bug report
description: Something is broken or the score looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove your name, phone number, email and anything else personal from any profile you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected and what you got.
      placeholder: |
        I ran `naukri-optimizer check profile.json` and ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Paste the terminal output. Run with `--json` if the score looks wrong.
      render: text
  - type: textarea
    id: profile
    attributes:
      label: Profile that shows the problem (optional, anonymised)
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `naukri-optimizer --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Windows 11"
  - type: dropdown
    id: provider
    attributes:
      label: AI provider (if the problem is with `rewrite`)
      options:
        - Not using rewrite
        - OpenAI
        - Anthropic
        - OpenAI-compatible (--base-url)
        - Ollama
